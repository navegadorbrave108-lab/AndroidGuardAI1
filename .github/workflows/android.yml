name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          if [ -f "AndroidGuardAI.zip" ]; then
            unzip -o AndroidGuardAI.zip -d proyecto
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar wrapper y compilar APK
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGuardAI-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
