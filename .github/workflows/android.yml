name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          if [ -f "AndroidGuardAI.zip" ]; then
            unzip -o AndroidGuardAI.zip -d proyecto
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar APK
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGuardAI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
